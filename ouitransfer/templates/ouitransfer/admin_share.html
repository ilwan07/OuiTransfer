{%load static%}
{%load i18n%}

<!DOCTYPE html>
<html>
{%include "ouitransfer/sub/head.html"%}

<body>
<header>
    <h2>{%trans "Create a file share"%}</h2>
</header>

<main>
    <form id="share-form" method="post" action="{%url 'share'%}">
    {%csrf_token%}
    <div id="formcontent">
        <div class="inline-input" id="email-div">
            <input type="checkbox" name="send-email" id="send-email" checked>
            <label for="send-email">{%trans "Send email to:"%}</label>
            <input type="text" name="email-address" id="email-address" minlength="4" maxlength="320">
            <select name="email-lang" id="email-lang">
                {%for lang in LANGUAGES%}
                    <option value="{{lang.0}}" {%if lang.0 == USER_LANG%}selected="selected"{%endif%}>{{lang.0}}</option>
                {%endfor%}
            </select>
        </div>
        <br>
        <div class="inline-input">
            <label>{%trans "Message (optional):"%}</label>
            <textarea name="content" id="content" rows="2"></textarea>
        </div>
        <br>
        <div class="inline-input" id="expire-div">
            <input type="checkbox" name="expire" id="expire">
            <label for="expire">{%trans "Delete in:"%}</label>
            <span class="number-input" id="delay-span">
                <button type="button" target="delay" decr>–</button>
                <input type="number" name="delay" id="delay" min="1" step="1" value="7">
                <button type="button" target="delay" incr>+</button>
                <select name="delay-unit" id="delay-unit">
                    <option value="minutes">{%trans "minute(s)"%}</option>
                    <option value="hours">{%trans "hour(s)"%}</option>
                    <option value="days" selected="selected">{%trans "day(s)"%}</option>
                    <option value="months">{%trans "months(s)"%}</option>
                </select>
            </span>
        </div>
    </div>
    </form>
</main>

{%include "ouitransfer/sub/footer.html"%}

<script src="{% static 'ouitransfer/js/admin_share_interact.js' %}"></script>

</body>
</html>
